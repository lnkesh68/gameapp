<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coin Games Pro</title>
    <style>
        *{ margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; -webkit-tap-highlight-color:transparent; }
        body{ background:#0f172a; color:white; overflow:hidden; text-align:center; height: 100vh; }
        .hidden{display:none !important;}
        
        .topbar{ height: 50px; background:#111827; display:flex; justify-content:space-between; align-items:center; padding:0 15px; position:relative; z-index:100; }
        
        #adFooter{ position:fixed; bottom:0; left:0; width:100%; height:50px; background:#000; z-index:9999; display:flex; justify-content:center; align-items:center; border-top:1px solid #333; }

        .game-container { height: calc(100vh - 100px); width: 100%; position: relative; overflow-y: auto; padding-bottom: 20px; }
        
        /* Select Game Text - Bada aur Bold */
        .main-title { font-size: 34px; font-weight: 900; margin: 25px 0; color: #f8fafc; text-shadow: 0 0 15px rgba(255,255,255,0.3); }

        /* Game Card Design */
        .game-card { display: flex; flex-direction: column; align-items: center; margin-bottom: 35px; width: 100%; }

        /* Images - Stable Links Applied */
        .game-img {
            width: 120px;
            height: auto;
            margin-bottom: 12px;
            filter: drop-shadow(0 8px 15px rgba(0,0,0,0.5));
        }

        /* Buttons - Colorful, Chote aur Stylish */
        .btn-game {
            color: white;
            padding: 12px 20px;
            border-radius: 50px; /* Round Pill Style */
            border: none;
            width: 65%; /* Chota width */
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: 0.2s;
        }

        /* Gradient Colors for Buttons */
        .btn-bubble { background: linear-gradient(135deg, #06b6d4, #3b82f6); }
        .btn-racing { background: linear-gradient(135deg, #ef4444, #991b1b); }
        
        .btn-game:active { transform: scale(0.95); }

        /* Bubble Game UI */
        #bubbleArea{ position:relative; width:95%; height:55vh; background:#1e293b; border-radius:18px; overflow:hidden; margin:10px auto; border:2px solid #334155; }
        .bubble{ position:absolute; border-radius:50%; background:radial-gradient(circle,#67e8f9,#0891b2); box-shadow: 0 0 10px #22d3ee; cursor: pointer; }

        /* Racing Game UI */
        #racingGame{ background:#16a34a; height: 100%; width: 100%; position: relative; overflow:hidden; }
        #road{ position:absolute; width:200px; height:100%; background:#333; left:50%; transform:translateX(-50%); overflow:hidden; border-left:4px solid #555; border-right:4px solid #555; }
        .line{ position:absolute; width:6px; height:50px; background:#fff; left:50%; transform:translateX(-50%); }
        #bike{ position:absolute; width:40px; height:70px; bottom:120px; left:80px; background:#ef4444; border-radius:8px; z-index:10; border:2px solid #fff; }
        .enemy{ position:absolute; width:40px; height:70px; background:#2563eb; border-radius:8px; }

        #controls{ position:absolute; bottom:20px; width:100%; display:flex; justify-content:center; gap:15px; z-index:1000; }
        .ctrl{ width:65px; height:65px; border-radius:50%; background:rgba(255,255,255,0.25); color:white; font-size:24px; border:none; backdrop-filter: blur(5px); display:flex; justify-content:center; align-items:center; }
        
        .level-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; padding:20px; }
        .levelBtn{ background:#2563eb; color:white; padding:10px; border-radius:8px; border:none; height:50px; cursor: pointer; }
        .locked{ background:#334155 !important; opacity:0.5; }
    </style>
</head>
<body>

<div class="topbar">
    <span>Coin Games</span>
    <span>💰 <b id="coins">0</b></span>
</div>

<div class="game-container">
    <div id="home">
        <h1 class="main-title">SELECT GAME</h1>
        
        <div class="game-card">
            <img src="https://i.ibb.co/CpJF3t94/images-removebg-preview.png" class="game-img" alt="Bubble">
            <button class="btn-game btn-bubble" onclick="openLevels('bubble')">Bubble Pop</button>
        </div>

        <div class="game-card">
            <img src="https://i.ibb.co/67623rh3/images-1-removebg-preview.png" class="game-img" alt="Racing">
            <button class="btn-game btn-racing" onclick="openLevels('racing')">Bike Racing</button>
        </div>
    </div>

    <div id="levelScreen" class="hidden">
        <button onclick="goHome()" style="color:red; background:none; border:none; margin:15px; font-weight:bold;">← BACK</button>
        <div class="level-grid" id="levels"></div>
    </div>

    <div id="bubbleGame" class="hidden">
        <h3 id="bubbleTitle" style="margin-top:10px;">Level 1</h3>
        <p>Time: <span id="timer">20</span>s | Target: <span id="target">0</span></p>
        <div id="bubbleArea"></div>
        <button class="btn-game" style="width:120px; background:#dc2626;" onclick="exitGame()">EXIT</button>
    </div>

    <div id="racingGame" class="hidden">
        <div id="road"><div id="bike"></div></div>
        <div style="position:absolute; top:10px; left:10px; background:rgba(0,0,0,0.6); padding:8px; border-radius:8px; font-size:12px;">
            🏁 Goal: <span id="dist">0</span> / 500m
        </div>
        <div id="controls">
            <button class="ctrl" onmousedown="moveBike(-30)" ontouchstart="moveBike(-30)">⬅️</button>
            <button class="ctrl" style="background:#dc2626;" onmousedown="isBreaking=true" ontouchstart="isBreaking=true" onmouseup="isBreaking=false" ontouchend="isBreaking=false">🛑</button>
            <button class="ctrl" onmousedown="moveBike(30)" ontouchstart="moveBike(30)">➡️</button>
        </div>
    </div>
</div>

<div id="adFooter">

</div>

<script>
let coins = parseInt(localStorage.getItem("coins")) || 0;
document.getElementById("coins").innerText = coins;
let selectedGame = "", currentLevel = 1, gameActive = false, isBreaking = false;
let bikeX = 80, distance = 0, currentSpeed = 0;

const road = document.getElementById("road");
for(let i=0; i<6; i++) {
    let line = document.createElement("div");
    line.className = "line";
    line.style.top = (i * 100) + "px";
    road.appendChild(line);
}

function openLevels(game) {
    selectedGame = game;
    document.getElementById("home").classList.add("hidden");
    document.getElementById("levelScreen").classList.remove("hidden");
    renderLevels();
}

function renderLevels() {
    let unlocked = parseInt(localStorage.getItem(selectedGame+"_un")) || 1;
    let grid = document.getElementById("levels");
    grid.innerHTML = "";
    for(let i=1; i<=20; i++){
        let b = document.createElement("button");
        b.innerText = i;
        b.className = "levelBtn " + (i <= unlocked ? "" : "locked");
        if(i <= unlocked) b.onclick = () => startGame(i);
        grid.appendChild(b);
    }
}

function startGame(level) {
    currentLevel = level;
    document.getElementById("levelScreen").classList.add("hidden");
    if(selectedGame === 'bubble') startBubble(level);
    else startRacing(level);
}

let bubbleTimer, moveIntervals = [];
function startBubble(level) {
    document.getElementById("bubbleGame").classList.remove("hidden");
    let area = document.getElementById("bubbleArea");
    area.innerHTML = "";
    moveIntervals.forEach(clearInterval);
    moveIntervals = [];
    let popped = 0; 
    let total = 5 + (level * 2); 
    document.getElementById("target").innerText = total;
    let time = Math.max(10, 25 - level);
    document.getElementById("timer").innerText = time;
    bubbleTimer = setInterval(() => {
        time--;
        document.getElementById("timer").innerText = time;
        if(time <= 0) { clearInterval(bubbleTimer); alert("Time Up!"); exitGame(); }
    }, 1000);
    for(let i=0; i<total; i++) {
        let b = document.createElement("div");
        b.className = "bubble";
        let size = Math.max(20, 55 - (level * 2.5));
        b.style.width = size + "px"; b.style.height = size + "px";
        b.style.left = Math.random()*85 + "%"; b.style.top = Math.random()*85 + "%";
        if(level > 2) {
            let m = setInterval(() => {
                b.style.left = Math.random()*85 + "%";
                b.style.top = Math.random()*85 + "%";
            }, 2500 - (level * 100));
            moveIntervals.push(m);
        }
        b.onclick = () => { b.remove(); popped++; if(popped === total) { clearInterval(bubbleTimer); winGame(); } };
        area.appendChild(b);
    }
}

function startRacing(level) {
    gameActive = true; distance = 0; bikeX = 80; isBreaking = false; currentSpeed = 0;
    document.getElementById("racingGame").classList.remove("hidden");
    requestAnimationFrame(gameLoop);
    spawnEnemy();
}

function gameLoop() {
    if(!gameActive) return;
    let targetSpeed = 5 + (currentLevel * 0.5);
    if(isBreaking) { currentSpeed = Math.max(1.5, currentSpeed - 0.4); } 
    else { if(currentSpeed < targetSpeed) currentSpeed += 0.1; }
    let lines = document.querySelectorAll(".line");
    lines.forEach(l => {
        let t = parseFloat(l.style.top) + currentSpeed;
        l.style.top = (t > 600 ? -100 : t) + "px";
    });
    let enemies = document.querySelectorAll(".enemy");
    enemies.forEach(en => {
        let t = parseFloat(en.style.top) + (currentSpeed * 0.85);
        en.style.top = t + "px";
        let enX = parseInt(en.style.left);
        if(t > 320 && t < 390 && Math.abs(enX - bikeX) < 35) gameOver();
        if(t > 600) en.remove();
    });
    distance += currentSpeed / 20;
    document.getElementById("dist").innerText = Math.floor(distance);
    if(distance >= 500) winGame();
    else requestAnimationFrame(gameLoop);
}

function spawnEnemy() {
    if(!gameActive) return;
    let en = document.createElement("div");
    en.className = "enemy";
    en.style.left = Math.random() > 0.5 ? "30px" : "130px";
    en.style.top = "-100px";
    road.appendChild(en);
    let spawnRate = Math.max(700, 3000 - (currentLevel * 200));
    setTimeout(spawnEnemy, spawnRate);
}

function moveBike(dir) {
    bikeX += dir;
    if(bikeX < 20) bikeX = 20; if(bikeX > 140) bikeX = 140;
    document.getElementById("bike").style.left = bikeX + "px";
}

function winGame() {
    gameActive = false; clearInterval(bubbleTimer);
    moveIntervals.forEach(clearInterval);
    alert("Level Complete! +100 Coins");
    coins += 100; localStorage.setItem("coins", coins);
    let unlocked = parseInt(localStorage.getItem(selectedGame+"_un")) || 1;
    if(currentLevel == unlocked) localStorage.setItem(selectedGame+"_un", unlocked + 1);
    exitGame();
}

function gameOver() { gameActive = false; alert("Crashed!"); exitGame(); }

function goHome() {
    document.getElementById("levelScreen").classList.add("hidden");
    document.getElementById("home").classList.remove("hidden");
}

function exitGame() {
    gameActive = false; clearInterval(bubbleTimer);
    moveIntervals.forEach(clearInterval);
    document.querySelectorAll(".enemy").forEach(e => e.remove());
    document.getElementById("bubbleGame").classList.add("hidden");
    document.getElementById("racingGame").classList.add("hidden");
    document.getElementById("levelScreen").classList.remove("hidden");
    document.getElementById("coins").innerText = coins;
    renderLevels();
}
</script>
</body>
</html>
